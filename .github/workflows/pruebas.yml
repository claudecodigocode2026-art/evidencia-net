# Compila la aplicación .NET y ejecuta las pruebas automáticas en cada cambio.
# Si una prueba falla, la ejecución queda en rojo y se ve en la pull request.
name: Pruebas automáticas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compilar la solución
        run: dotnet build eVidencia.NET/eVidencia.sln -c Release

      - name: Ejecutar las pruebas de negocio
        run: >
          dotnet run --project eVidencia.NET/pruebas/eVidencia.Pruebas -c Release --no-build --
          eVidencia.NET/datos/eVidencia_BBDD_Demo_sin_datos_personales.xlsx
